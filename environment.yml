# Conda env for public CDFD paper-local supplementary scripts.
name: cdfd-public-science
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10
  - pip
  - numpy>=1.24
  - scipy>=1.11
  - pandas>=2.0
  - matplotlib>=3.7
  - sympy>=1.12
  - statsmodels>=0.14
  - scikit-learn>=1.3
  - notebook
  - ipykernel
  - ipython>=8.12
  - pytest
