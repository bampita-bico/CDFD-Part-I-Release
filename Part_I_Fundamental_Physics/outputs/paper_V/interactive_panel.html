*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;color:var(--ink);background:#fff}

.controls{margin-bottom:18px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}label{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}

@media(max-width:980px){.grid{grid-template-columns:1fr}.figure{height:420px}.metrics{grid-template-columns:1fr}}
</style></head>
<body><header><h1>Paper V: Zero-Parameter Chirality Phase</h1><p>Interactive local panel for figures and numerical output tables.</p><p class="links"><a href="../interactive_index.html">Physics interactive index</a></p></header>

<section class="panel" style="margin-top:18px"><h2>Data Table</h2><div id="table" class="tablebox"></div></section></main>
<script>const DATA={"tables": {"checks_autodiff_brannen.csv": [{"finite_diff_dKoide_numeric_est": "-8.326672684688674e-11", "torch_abs_dQ_dtheta": "", "jax_abs_dQ_dtheta": "", "backends": "torch=missing, jax=missing, numba=ok"}], "checks_brannen_fit_reference.csv": [{"theta_coarse_deg": "12.733273327332732", "theta_refined_deg": "12.732305177117995"}], "checks_koide_brannen.csv": [{"Q_prediction": "0.6666666666666669", "Q_target": "0.6666666666666666", "agreement_ok": "True", "max_abs_residual_numba_grid": "6.661338147750939e-16"}], "checks_numba_koide_flat.csv": [{"numba_vs_numpy_max_abs_Q_residual": "1.1102230246251565e-16", "r2_sklearn": "0.9996360989810772", "numba": "used"}], "checks_scipy_theta_from_phi.csv": [{"theta_scipy_bounded_rad": "0.22222222222222215", "objective_residual": "0.0", "iterations_optional": "6"}], "checks_summary_V_gate.csv": [{"equilibrium_three_theta_phi_pi": "True", "scipy_bounded_theta_equals_Q_over_3": "True", "koide_Q_predictions": "True", "electron_calibration_exact": "True", "symm_algebra_rows_0_2": "True", "mu_within_25ppm_fractional": "True", "tau_sigma_within_3pt5_sigma": "True", "numba_koide_scan_deviation_gate": "True", "torch_dKoide_near_zero_optional": "True", "jax_dKoide_near_zero_optional": "True", "overall_ok": "True"}], "checks_symbolic_V.csv": [{"check": "three_theta_plus_phi_c_equals_pi_substitution_Q", "pass": "True", "simplified_residual": "0"}, {"check": "self_consistency_three_theta_equals_Q_symbolic", "pass": "True", "simplified_residual": "0"}, {"check": "phi_c_lit_val_pi_minus_Q_Rational_exact", "pass": "True", "simplified_residual": "-2/3 + pi"}], "table1_algebra_theta_phi_derivation.csv": [{"Q_koide": "0.6666666666666666", "theta_rad_Q_over_3": "0.2222222222222222", "theta_deg": "12.732395447351626", "phi_c_rad_pi_minus_Q": "2.4749259869231266", "phi_c_deg": "141.80281365794514", "three_theta_rad": "0.6666666666666666", "equilibrium_three_theta_plus_phi_minus_pi_residual": "0.0", "equilibrium_agreement_gate": "True", "three_theta_minus_Q_residual": "0.0"}], "table2_chain_steps.csv": [{"symbol": "alpha_codata_via_chi_inverse", "value": "0.0072973525692838015", "notes": "Paper I public chi equilibrium"}, {"symbol": "chi_eq", "value": "137.035999084", "notes": "Paper I \\(\\chi_{\\mathrm{eq}} \\approx 137.036\\)"}, {"symbol": "kappa", "value": "117361.9949447333", "notes": "Paper III \\(\\chi^2(\\ln 8\\chi-\\beta+1)\\)"}, {"symbol": "g_dimensionless_energy", "value": "1575.8277116084441", "notes": "Papers I+III \\(\\chi(\\ln8\\chi-\\beta)+\\kappa/\\chi\\)"}, {"symbol": "Q_brannen_theorem", "value": "0.6666666666666666", "notes": "Paper II Koide invariant"}, {"symbol": "theta_derived_rad", "value": "0.2222222222222222", "notes": "Paper V \\(Q/3\\)"}, {"symbol": "phi_c_derived_rad", "value": "2.4749259869231266", "notes": "Paper V \\(\\pi - Q\\) with \\(Q=2/3\\) rad"}, {"symbol": "A_e_min", "value": "0.040349908219207364", "notes": "Brannen minimum amplitude derived"}, {"symbol": "M_scale_MeV", "value": "313.8592302862007", "notes": "Paper II \\(M=m_e/A_e^2\\)"}, {"symbol": "rho0_kg_m3", "value": "15867181338893.785", "notes": "Papers IV\u2013V: $M_{\\mathrm{kg}}/(a^3 g)$"}], "table3_lepton_predictions.csv": [{"lepton": "electron", "predicted_MeV": "0.51099895", "pdg_2022_MeV": "0.51099895", "error_MeV": "0.0", "sigma": "0.0", "ppm_vs_pdg_percent": "0.0"}, {"lepton": "muon", "predicted_MeV": "105.65941435323278", "pdg_2022_MeV": "105.6583755", "error_MeV": "0.0010388532327709754", "sigma": "451.67531859607624", "ppm_vs_pdg_percent": "9.832190092318172"}, {"lepton": "tau", "predicted_MeV": "1776.9849684139715", "pdg_2022_MeV": "1776.86", "error_MeV": "0.12496841397160097", "sigma": "1.0414034497633415", "ppm_vs_pdg_percent": "70.33104125908629"}], "table3_rho_derived_IV_style.csv": [{"rho0_kg_m3": "15867181338893.785", "g_factor": "1575.8277116084441", "consistent_with_paper_IV_path": "15867181338893.785"}], "table4_error_ppm_comparison.csv": [{"lepton": "electron", "fitted_err_ppm_vs_pdg_percent": "0.0", "derived_err_ppm_vs_pdg_percent": "0.0"}, {"lepton": "muon", "fitted_err_ppm_vs_pdg_percent": "-78.61859875413214", "derived_err_ppm_vs_pdg_percent": "9.832190092318172"}, {"lepton": "tau", "fitted_err_ppm_vs_pdg_percent": "-10.378262055632526", "derived_err_ppm_vs_pdg_percent": "70.33104125908629"}], "table4_fitted_vs_derived.csv": [{"quantity": "theta_deg", "fitted_Paper_II_refined": "12.732305177117995", "derived_Paper_V_Q_over_3": "12.732395447351626", "delta_arcmin": "0.005416214017870402", "derived_Paper_V_pi_minus_Q": ""}, {"quantity": "phi_c_deg", "fitted_Paper_II_refined": "141.80308446864603", "derived_Paper_V_Q_over_3": "", "delta_arcmin": "0.01624864205382437", "derived_Paper_V_pi_minus_Q": "141.80281365794514"}, {"quantity": "M_MeV", "fitted_Paper_II_refined": "313.8337711696426", "derived_Paper_V_Q_over_3": "313.8592302862007", "delta_arcmin": "", "derived_Paper_V_pi_minus_Q": ""}]}, "figures": ["fig5_0_panel.pdf", "fig5_1_panel.pdf", "fig5_2_panel.pdf", "paper_V_figures.pdf"]};</script><script>
const W=900,H=380,ML=62,MR=24,MT=24,MB=54;
function fmt(v){ if(v===null||v===''||Number.isNaN(Number(v))) return 'NaN'; const n=Number(v); if(Math.abs(n)>=10000||Math.abs(n)<0.001&&n!==0) return n.toExponential(2); return n.toFixed(4).replace(/\.?0+$/,'');}
function num(v){ const n=Number(v); return Number.isFinite(n)?n:null; }
function clear(n){ while(n.firstChild)n.removeChild(n.firstChild); }
function el(name,attrs={},text=''){ const n=document.createElementNS('http://www.w3.org/2000/svg',name); for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,v); if(text)n.textContent=text; return n; }
function metric(items){ const m=document.getElementById('metrics'); m.innerHTML=''; items.forEach(it=>{const d=document.createElement('div'); d.innerHTML=`<b>${it.value}</b><span>${it.label}</span>`; m.appendChild(d);});}
function scales(xs,ys){ const xmin=Math.min(...xs),xmax=Math.max(...xs); let ymin=Math.min(...ys),ymax=Math.max(...ys); if(!Number.isFinite(ymin)){ymin=0;ymax=1} if(ymin===ymax){ymin-=1;ymax+=1} return {x:v=>ML+(v-xmin)/(xmax-xmin||1)*(W-ML-MR),y:v=>H-MB-(v-ymin)/(ymax-ymin)*(H-MT-MB),ymin,ymax};}
function axes(svg,s,xlab,ylab){ svg.appendChild(el('line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#333'})); svg.appendChild(el('line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#333'})); for(let i=0;i<5;i++){const y=MT+i*(H-MT-MB)/4,val=s.ymax-(s.ymax-s.ymin)*i/4; svg.appendChild(el('text',{x:ML-9,y:y+4,'text-anchor':'end','font-size':12,fill:'#555'},fmt(val)));} svg.appendChild(el('text',{x:(W+ML-MR)/2,y:H-15,'text-anchor':'middle','font-size':13,fill:'#555'},xlab)); svg.appendChild(el('text',{x:16,y:(H+MT-MB)/2,transform:`rotate(-90 16 ${(H+MT-MB)/2})`,'text-anchor':'middle','font-size':13,fill:'#555'},ylab));}
function plot(rows,xk,yk){ const svg=document.getElementById('chart'); clear(svg); const pts=rows.map((r,i)=>({x:num(r[xk])??i,y:num(r[yk])})).filter(p=>p.y!==null); if(!pts.length){svg.appendChild(el('text',{x:W/2,y:H/2,'text-anchor':'middle',fill:'#666'},'No numeric data for selected columns')); return;} const s=scales(pts.map(p=>p.x),pts.map(p=>p.y)); axes(svg,s,xk,yk); let d=''; pts.forEach((p,i)=>{d+=(i?'L':'M')+s.x(p.x)+' '+s.y(p.y)+' ';}); svg.appendChild(el('path',{d,fill:'none',stroke:'#2f6f9f','stroke-width':3})); pts.forEach(p=>{const c=el('circle',{cx:s.x(p.x),cy:s.y(p.y),r:3,fill:'#b9574f'}); c.appendChild(el('title',{},`${xk}: ${fmt(p.x)}\n${yk}: ${fmt(p.y)}`)); svg.appendChild(c);});}
function table(rows){ const box=document.getElementById('table'); box.innerHTML=''; if(!rows.length){box.textContent='No rows'; return;} const keys=Object.keys(rows[0]); const t=document.createElement('table'); t.innerHTML='<thead><tr>'+keys.map(k=>`<th>${k}</th>`).join('')+'</tr></thead>'; const tb=document.createElement('tbody'); rows.slice(0,500).forEach(r=>{const tr=document.createElement('tr'); tr.innerHTML=keys.map(k=>`<td>${r[k]}</td>`).join(''); tb.appendChild(tr);}); t.appendChild(tb); box.appendChild(t);}
function numericKeys(rows){ if(!rows.length)return []; const keys=Object.keys(rows[0]); return keys.filter(k=>rows.some(r=>num(r[k])!==null)); }
</script>
<script>
const figsel=document.getElementById('figsel'), datasel=document.getElementById('datasel'), xsel=document.getElementById('xsel'), ysel=document.getElementById('ysel'), figbox=document.getElementById('figbox');
DATA.figures.forEach(f=>{const o=document.createElement('option'); o.value=f; o.textContent=f; figsel.appendChild(o);});
Object.keys(DATA.tables).forEach(f=>{const o=document.createElement('option'); o.value=f; o.textContent=f; datasel.appendChild(o);});
function renderFigure(){ const f=figsel.value; figbox.innerHTML=''; if(!f){figbox.textContent='No figure files found'; return;} if(f.toLowerCase().endsWith('.pdf')) figbox.innerHTML=`<object data="${f}" type="application/pdf"><p><a href="${f}">Open ${f}</a></p></object>`; else figbox.innerHTML=`<img src="${f}" alt="${f}">`; }
function loadColumns(){ const rows=DATA.tables[datasel.value]||[]; const keys=numericKeys(rows); xsel.innerHTML=''; ysel.innerHTML=''; (keys.length?keys:Object.keys(rows[0]||{})).forEach(k=>{let o=document.createElement('option'); o.value=k; o.textContent=k; xsel.appendChild(o.cloneNode(true)); ysel.appendChild(o);}); if(keys.length>1) ysel.value=keys[1]; }
function renderData(){ const rows=DATA.tables[datasel.value]||[]; metric([{label:'dataset',value:datasel.value||'none'},{label:'rows',value:rows.length},{label:'figures',value:DATA.figures.length}]); table(rows); plot(rows,xsel.value,ysel.value); }
figsel.onchange=renderFigure; datasel.onchange=()=>{loadColumns();renderData();}; xsel.onchange=renderData; ysel.onchange=renderData; renderFigure(); loadColumns(); renderData();
</script></body></html>
