<body><header><h1>Paper IV: Vacuum Equation of State</h1><p>Interactive local panel for Part I figures, numerical tables, and gate checks.</p><p class="links"><a href="../interactive_index.html">Part I interactive index</a></p></header>

<script>const DATA={"tables": {"checks_autodiff_phi_sensitivity.csv": [{"finite_diff_d_gAe2_dphi_fixed_branch_k": "1", "finite_diff_d_gAe2_dphi_numeric": "44.0355500441747", "torch_d_gAe2_dphi_optional": "", "jax_d_gAe2_dphi_optional": "", "backends": "torch=missing, jax=missing, numba=ok"}], "checks_brannen_theta_IV.csv": [{"theta_deg_coarse": "12.733273327332732", "theta_deg_refined": "12.732305177117995", "paper_text_theta_deg_nominal": "12.7325"}], "checks_numba_FN_IV.csv": [{"numba_vs_numpy_max_abs_FN_ratio": "0.0", "r2_sklearn": "1.0", "numba": "used"}], "checks_scipy_implicit_dimensionless.csv": [{"Ae_from_phi_min": "0.04035154483750314", "theta_implicit_rad": "0.22222064670942876", "h_g_Ae_squared": "2.5658370150963505", "X_analytic": "0.38973636833376524", "X_root_scalar": "0.38973636833376524", "agreement": "True", "abs_diff": "0.0"}], "checks_statsmodels_FN_IV.csv": [{"expected_slope_three_quarters": "0.75", "fitted_slope_logE_vs_logQ": "0.7500000000000002", "rsquared": "1.0", "n_points": "4"}], "checks_summary_IV_gate.csv": [{"compton_coincidence": "True", "rho_self_consistency_loop": "True", "theta_implicit_equals_refined": "True", "dimensionless_X_closure": "True", "sympy_X_algebra": "True", "scipy_implicit_X_agreement": "True", "overall_ok": "True"}], "checks_symbolic_IV.csv": [{"check": "X_rho_a3_me_equals_inv_gAe2", "pass": "True", "simplified_X": "1/(A_e**2*g)", "target": "1/(A_e**2*g)"}], "table1_geometric_vacuum_scales.csv": [{"a_classical_m": "2.8179403205e-15", "R_chi_times_a_m": "3.861592674408731e-13", "R_reduced_Compton_geom_m": "3.8615926744e-13", "compton_coincidence_agreement": "True", "abs_delta_m": "8.731238716730994e-25", "chi_target": "137.035999177", "alpha_inverse": "0.0072973525643314245", "ratio_a_over_R_equals_alpha_check": "0.0072973525643314245", "ratio_a_over_alpha_direct": "0.0072973525643314245", "ratio_match": "True", "bohr_a0_hbar_over_mc_alpha_m": "5.2917721055218415e-11", "J_crit_Pa": "1.425955464540434e+30", "u_vacuum_J_m3": "1.425955464540434e+30", "u_em_core_J_m3": "1.4557780544113527e+29", "u_vac_over_u_em": "9.795143292752979"}], "table2_master_rho_equation_numbers.csv": [{"theta_deg_refined": "12.732305177117995", "phi_c_deg_from_chirality": "141.80308446864603", "A_e_minimum": "0.04035154483750314", "g_chi_beta": "1575.8277128638856", "kappa_derived": "117361.995116774", "M_Brannen_MeV": "313.8337711696426", "c2_a3_g_factor_J_times_m3_over_kg": "3.169169833058186e-24", "rho_0_derived_J_path_kg_m3": "15865894275508.777", "rho_verify_from_m_e_identity_kg_m3": "15865894275508.78", "rho_loop_agreement": "True", "rho_rel_diff": "1.2310210607005753e-16", "theta_check_vs_refined_implicit": "True"}], "table3_dimensionless_X_factors.csv": [{"X1_rho_a3_over_me": "0.3897363683337652", "inv_gAe2_algebraic": "0.38973636833376524", "X1_matches_inv_gate": "True", "X2_rho_a4_c_over_hbar": "0.0028440436847863163"}], "table4_fn_knot_family_scales.csv": [{"n": "3", "Hopf_Q": "3", "M_n_MeV": "313.8337711696426", "E_ratio_to_trefoil": "1.0"}, {"n": "5", "Hopf_Q": "5", "M_n_MeV": "460.3479756808909", "E_ratio_to_trefoil": "1.4668528946556556"}, {"n": "7", "Hopf_Q": "7", "M_n_MeV": "592.491691331752", "E_ratio_to_trefoil": "1.8879156603305163"}, {"n": "9", "Hopf_Q": "9", "M_n_MeV": "715.3862960919312", "E_ratio_to_trefoil": "2.279507056954778"}], "table4_light_hadrons_comparison.csv": [{"label": "Pion_pi0", "mass_MeV": "134.98"}, {"label": "Pion_pi_pm", "mass_MeV": "139.57"}, {"label": "M5_predicted", "mass_MeV": "460.3479756808909"}, {"label": "Kaon_pm", "mass_MeV": "493.68"}, {"label": "Eta", "mass_MeV": "547.86"}, {"label": "M7_predicted", "mass_MeV": "592.491691331752"}, {"label": "M9_predicted", "mass_MeV": "715.3862960919312"}, {"label": "Proton", "mass_MeV": "938.27"}, {"label": "Neutron", "mass_MeV": "939.57"}, {"label": "Lambda_baryon", "mass_MeV": "1115.68"}], "table5_vacuum_physical_context.csv": [{"rho0_kg_m3": "15865894275508.777", "K_bulk_modulus_Pa": "1.425955464540434e+30", "rho0_over_three_me_over_four_pi_a3_note": "1.6325238821254962", "comparison_u_nuclear_J_m3": "2.0671369110946804e+34", "comparison_u_qcd_geom_J_m3": "3.336345101371611e+34", "comparison_classical_sphere_factor": "0.3897363683337652"}], "table6_program_status_chain.csv": [{"item": "alpha_derived_series", "value_or_gate": "True", "note": "Paper I public chi equilibrium"}, {"item": "kappa_algebraic", "value_or_gate": "True", "note": "Paper III \u03c7\u00b2 term"}, {"item": "koide_theorem_series", "value_or_gate": "True", "note": "Paper II Z\u2083"}, {"item": "master_equation_article_IV", "value_or_gate": "True", "note": "Eq.(master) structure"}, {"item": "Phi_c_from_EOS", "value_or_gate": "False", "note": "Open \u2014 requires Navier\u2013Stokes+CDFT"}, {"item": "M5_MeV_prediction", "value_or_gate": "True", "note": "460.35"}, {"item": "rho0_inference_uses_PDG_theta", "value_or_gate": "True", "note": "\u03b8 from masses until EOS closes"}]}, "figures": ["fig4_0_panel.pdf", "fig4_1_panel.pdf", "fig4_2_panel.pdf", "paper_IV_figures.pdf"]};</script><script>
const W=900,H=380,ML=62,MR=24,MT=24,MB=54;
function fmt(v){ if(v===null||v===''||Number.isNaN(Number(v))) return 'NaN'; const n=Number(v); if(Math.abs(n)>=10000||Math.abs(n)<0.001&&n!==0) return n.toExponential(2); return n.toFixed(4).replace(/\.?0+$/,'');}
function num(v){ const n=Number(v); return Number.isFinite(n)?n:null; }
function clear(n){ while(n.firstChild)n.removeChild(n.firstChild); }
function el(name,attrs={},text=''){ const n=document.createElementNS('http://www.w3.org/2000/svg',name); for(const [k,v] of Object.entries(attrs)) n.setAttribute(k,v); if(text)n.textContent=text; return n; }
function metric(items){ const m=document.getElementById('metrics'); m.innerHTML=''; items.forEach(it=>{const d=document.createElement('div'); d.innerHTML=`<b>${it.value}</b><span>${it.label}</span>`; m.appendChild(d);});}
function scales(xs,ys){ const xmin=Math.min(...xs),xmax=Math.max(...xs); let ymin=Math.min(...ys),ymax=Math.max(...ys); if(!Number.isFinite(ymin)){ymin=0;ymax=1} if(ymin===ymax){ymin-=1;ymax+=1} return {x:v=>ML+(v-xmin)/(xmax-xmin||1)*(W-ML-MR),y:v=>H-MB-(v-ymin)/(ymax-ymin)*(H-MT-MB),ymin,ymax};}
function axes(svg,s,xlab,ylab){ svg.appendChild(el('line',{x1:ML,y1:H-MB,x2:W-MR,y2:H-MB,stroke:'#333'})); svg.appendChild(el('line',{x1:ML,y1:MT,x2:ML,y2:H-MB,stroke:'#333'})); for(let i=0;i<5;i++){const y=MT+i*(H-MT-MB)/4,val=s.ymax-(s.ymax-s.ymin)*i/4; svg.appendChild(el('text',{x:ML-9,y:y+4,'text-anchor':'end','font-size':12,fill:'#555'},fmt(val)));} svg.appendChild(el('text',{x:(W+ML-MR)/2,y:H-15,'text-anchor':'middle','font-size':13,fill:'#555'},xlab)); svg.appendChild(el('text',{x:16,y:(H+MT-MB)/2,transform:`rotate(-90 16 ${(H+MT-MB)/2})`,'text-anchor':'middle','font-size':13,fill:'#555'},ylab));}
function plot(rows,xk,yk){ const svg=document.getElementById('chart'); clear(svg); const pts=rows.map((r,i)=>({x:num(r[xk])??i,y:num(r[yk])})).filter(p=>p.y!==null); if(!pts.length){svg.appendChild(el('text',{x:W/2,y:H/2,'text-anchor':'middle',fill:'#666'},'No numeric data for selected columns')); return;} const s=scales(pts.map(p=>p.x),pts.map(p=>p.y)); axes(svg,s,xk,yk); let d=''; pts.forEach((p,i)=>{d+=(i?'L':'M')+s.x(p.x)+' '+s.y(p.y)+' ';}); svg.appendChild(el('path',{d,fill:'none',stroke:'#2f6f9f','stroke-width':3})); pts.forEach(p=>{const c=el('circle',{cx:s.x(p.x),cy:s.y(p.y),r:3,fill:'#b9574f'}); c.appendChild(el('title',{},`${xk}: ${fmt(p.x)}\n${yk}: ${fmt(p.y)}`)); svg.appendChild(c);});}
function table(rows){ const box=document.getElementById('table'); box.innerHTML=''; if(!rows.length){box.textContent='No rows'; return;} const keys=Object.keys(rows[0]); const t=document.createElement('table'); t.innerHTML='<thead><tr>'+keys.map(k=>`<th>${k}</th>`).join('')+'</tr></thead>'; const tb=document.createElement('tbody'); rows.slice(0,500).forEach(r=>{const tr=document.createElement('tr'); tr.innerHTML=keys.map(k=>`<td>${r[k]}</td>`).join(''); tb.appendChild(tr);}); t.appendChild(tb); box.appendChild(t);}
function numericKeys(rows){ if(!rows.length)return []; const keys=Object.keys(rows[0]); return keys.filter(k=>rows.some(r=>num(r[k])!==null)); }
</script>
<script>
const figsel=document.getElementById('figsel'), datasel=document.getElementById('datasel'), xsel=document.getElementById('xsel'), ysel=document.getElementById('ysel'), figbox=document.getElementById('figbox');
DATA.figures.forEach(f=>{const o=document.createElement('option'); o.value=f; o.textContent=f; figsel.appendChild(o);});
Object.keys(DATA.tables).forEach(f=>{const o=document.createElement('option'); o.value=f; o.textContent=f; datasel.appendChild(o);});
function renderFigure(){ const f=figsel.value; figbox.innerHTML=''; if(!f){figbox.textContent='No figure files found'; return;} if(f.toLowerCase().endsWith('.pdf')) figbox.innerHTML=`<object data="${f}" type="application/pdf"><p><a href="${f}">Open ${f}</a></p></object>`; else figbox.innerHTML=`<img src="${f}" alt="${f}">`; }
function loadColumns(){ const rows=DATA.tables[datasel.value]||[]; const keys=numericKeys(rows); xsel.innerHTML=''; ysel.innerHTML=''; (keys.length?keys:Object.keys(rows[0]||{})).forEach(k=>{let o=document.createElement('option'); o.value=k; o.textContent=k; xsel.appendChild(o.cloneNode(true)); ysel.appendChild(o);}); if(keys.length>1) ysel.value=keys[1]; }
function renderData(){ const rows=DATA.tables[datasel.value]||[]; metric([{label:'dataset',value:datasel.value||'none'},{label:'rows',value:rows.length},{label:'figures',value:DATA.figures.length}]); table(rows); plot(rows,xsel.value,ysel.value); }
figsel.onchange=renderFigure; datasel.onchange=()=>{loadColumns();renderData();}; xsel.onchange=renderData; ysel.onchange=renderData; renderFigure(); loadColumns(); renderData();
</script></body></html>
